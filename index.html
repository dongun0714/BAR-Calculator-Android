<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:"><meta name="theme-color" content="#f7f8fa"><title>BAR 생산 계산기</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header class="top"><div class="brand"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i></span><div><h1>BAR 생산 계산기</h1><small>생산량 계산</small></div></div><span class="version">v1.2</span></header>
<section class="surface input-section"><div class="section-heading"><h2><span class="section-num">01</span>생산 조건</h2><span class="live"><span class="dot"></span>자동 계산</span></div>
<label class="wide input-field">전체 시트 수<input type="number" id="sheets" inputmode="numeric" min="0" step="1" value="1500"></label>
<div class="input-grid"><label class="input-field">S2 <small>2시트</small><input type="number" id="s2" inputmode="numeric" min="0" step="1" value="10"></label><label class="input-field">S3 <small>3시트</small><input type="number" id="s3" inputmode="numeric" min="0" step="1" value="53"></label><label class="input-field">EL3 <small>3시트</small><input type="number" id="el3" inputmode="numeric" min="0" step="1" value="0"></label></div>
<div class="inline-stat"><span>1BAR 층수</span><strong><span id="layers">63</span> <small>층</small></strong></div>
<p id="error" class="error" role="alert" hidden>입력값 확인</p></section>
<section class="surface results"><div class="section-heading"><h2><span class="section-num">02</span>생산 결과</h2></div>
<div class="hero"><span>완성 BAR</span><div><strong id="bars">8</strong><b>BAR</b></div><small>1BAR = <span id="perBar">179</span> 시트</small></div>
<div class="output-grid"><div class="output"><div class="output-name"><span class="chip two">2</span>S2</div><strong><span id="totalS2">80</span><small>개</small></strong><p><span id="s2used">160</span> 시트 사용</p></div><div class="output"><div class="output-name"><span class="chip three">3</span>S3</div><strong><span id="totalS3">424</span><small>개</small></strong><p><span id="s3used">1,272</span> 시트 사용</p></div><div class="output"><div class="output-name"><span class="chip el">E</span>EL3</div><strong><span id="totalEL3">0</span><small>개</small></strong><p><span id="el3used">0</span> 시트 사용</p></div></div>
<div class="inline-stat"><span>총 완성 층수</span><strong><span id="totalLayers">504</span> <small>층</small></strong></div></section>
<section class="surface overview"><div class="section-heading"><h2><span class="section-num">03</span>시트 현황</h2><span id="verified" class="verified">검산 완료</span></div>
<div class="summary"><div><span>전체</span><strong id="all">1,500 <small>개</small></strong></div><div><span>사용</span><strong id="used">1,432 <small>개</small></strong></div><div class="left"><span>잔여</span><strong id="remaining">68 <small>개</small></strong></div></div>
<div class="progress" role="progressbar" aria-label="시트 사용률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="95.5" id="progressbar"><div id="progress"></div></div><div class="progress-meta"><span>사용률</span><b id="pct">95.5%</b></div>
<div class="buttons"><button type="button" id="reset" class="reset">초기화</button><button type="button" id="copy" class="copy"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>결과 복사</button></div><div id="toast" aria-live="polite" class="toast"></div></section>
</main><script src="app.js"></script></body></html>
